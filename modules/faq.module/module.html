{% require_css %}
<style>
{% scope_css %}
  .faq-module {
    {{ module.styles.spacing_desktop.css }}
  }
  @media (max-width: 992px) {
    .faq-module {
      {{ module.styles.spacing_mobile.css }}
    }
  }
{% end_scope_css %}
</style>
{% end_require_css %}

<section class="faq-module" id="faq" data-screen-label="FAQ">
  <div class="content-wrapper faq-module__container">
    <div class="faq-module__eyebrow eyebrow"><span></span>{{ module.eyebrow|escape_html }}</div>
    <div class="faq-module__heading">{{ module.heading|sanitize_html }}</div>
     {% if module.show_link %}
      <a class="faq-module__link {{ module.link_style }}" href="{{ module.link.url.href|escape_url }}"
        {% if module.link.open_in_new_tab %}target="_blank" rel="noopener"{% endif %}>{{ module.link_text|escape_html }}</a>
    {% endif %}
    <div class="faq-module__list">
      {% for faq in module.faqs %}
        <details class="faq-module__item" name="faq-{{ module_id }}"{% if loop.first %} open{% endif %}>
          <summary class="faq-module__question">
            <span>{{ faq.question|escape_html }}</span>
            <span class="faq-module__toggle" aria-hidden="true"></span>
          </summary>
          <div class="faq-module__answer">{{ faq.answer|sanitize_html }}</div>
        </details>
      {% endfor %}
    </div>
   
  </div>
</section>
