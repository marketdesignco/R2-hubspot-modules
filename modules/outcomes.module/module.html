{% require_css %}
<style>
{% scope_css %}
  .outcomes-module {
    {{ module.styles.spacing_desktop.css }}
  }
  @media (max-width: 992px) {
    .outcomes-module {
      {{ module.styles.spacing_mobile.css }}
    }
  }
{% end_scope_css %}
</style>
{% end_require_css %}

<section class="outcomes-module" id="outcomes" data-screen-label="Outcomes">
  <div class="content-wrapper">
    <div class="outcomes-module__eyebrow eyebrow"><span></span>{{ module.eyebrow|escape_html }}</div>
    <div class="outcomes-module__header">
      <div class="outcomes-module__heading">{{ module.heading|sanitize_html }}</div>
      <div class="outcomes-module__intro">{{ module.intro|sanitize_html }}</div>
    </div>
    <div class="outcomes-module__grid">
      {% for item in module.outcomes %}
        <div class="outcomes-module__item" style="--accent-color: rgba({{ item.accent_color.color|convert_rgb }}, {{ item.accent_color.opacity / 100 }});">
          <span class="outcomes-module__dot"></span>{{ item.text|escape_html }}
        </div>
      {% endfor %}
    </div>
    <div class="outcomes-module__closing-note">{{ module.closing_note|sanitize_html }}</div>
  </div>
</section>
